  #root { background:#1B1B3A; }

</style>

<body>
<div id="root">
  <div id="boot">
    <div class="t">よみこみちゅう...</div>
    <div class="s" id="bootstep">じゅんび しています</div>
  </div>
</div>

<script>
// CDNから ライブラリを よみこむ。ダメなら べつの CDNを ためす。
var CDNS = [
  "https://unpkg.com/",
  "https://cdn.jsdelivr.net/npm/"
];
var LIBS = [
  ["react@18/umd/react.production.min.js", function(){ return window.React; }],
  ["react-dom@18/umd/react-dom.production.min.js", function(){ return window.ReactDOM; }],
  ["@babel/standalone@7/babel.min.js", function(){ return window.Babel; }]
];

function step(msg){
  var el = document.getElementById("bootstep");
  if (el) el.textContent = msg;
}

function fail(title, detail){
  var root = document.getElementById("root");
  root.innerHTML =
    '<div id="boot"><div class="t">' + title + '</div>' +
    '<div class="err">' + detail + '</div></div>';
}

function loadLib(i, cdnIndex, done){
  if (i >= LIBS.length) { done(); return; }
  var path = LIBS[i][0], check = LIBS[i][1];
  if (check()) { loadLib(i + 1, 0, done); return; }
  if (cdnIndex >= CDNS.length) {
    fail("ライブラリを よみこめませんでした",
      "インターネットに つながっているか かくにんしてください。<br><br>" +
      "また、ファイルアプリの プレビューでは そとから よみこむ しくみが とまるため、" +
      "この画面から さきに すすみません。<br><br>" +
      "GitHub Pages などに アップロードして、その URL を Safari や Chrome で ひらいてください。");
    return;
  }
  step("よみこみちゅう (" + (i + 1) + "/" + LIBS.length + ")");
  var sc = document.createElement("script");
  sc.src = CDNS[cdnIndex] + path;
  sc.crossOrigin = "anonymous";
  sc.onload = function(){ loadLib(i + 1, 0, done); };
  sc.onerror = function(){ loadLib(i, cdnIndex + 1, done); };
  document.head.appendChild(sc);
}

window.addEventListener("error", function(e){
  if (window.__started) return;
  fail("エラーが おきました", String(e.message || e));
});

loadLib(0, 0, function(){
  step("ゲームを じゅんびちゅう");
  window.__started = true;
  var code = document.getElementById("appcode").textContent;
  try {
    var out = Babel.transform(code, { presets: ["react"] }).code;
    (0, eval)(out);
  } catch (err) {
    fail("ゲームを はじめられませんでした", String(err && err.message ? err.message : err));
  }
});
</script>

<script type="text/plain" id="appcode">

// ---------- タイムゲージ ----------
// ステージが すすむほど じかんが みじかくなる(さいたん 60%)
function stageTimeFactor(stageNumber, isBoss) {
  const step = Math.floor((stageNumber - 1) / 5) * 0.05;
  const base = Math.max(0.6, 1 - step);
  return isBoss ? base * 0.9 : base;
}

// ---------- エンドレスタワー ----------
// さいしゅうしんか したら あそべる。かいを のぼるほど ボスが つよくなる
function towerEnemy(floor) {
  const base = BOSSES[(floor - 1) % BOSSES.length];
  const mul = 1 + (floor - 1) * 0.22;
  return {
    ...base,
    name: `${base.name} ${floor}かい`,
    hp: Math.round(base.hp * mul),
    atk: Math.round(base.atk * (1 + (floor - 1) * 0.12)),
    isBoss: true,
    isTower: true,
  };
}

const MY_MONSTER_MAX = 12;      // ほぞんできる かず
const MY_IMG_SIZE = 260;        // ほぞんする がぞうの おおきさ(px)

// しゃしんを せいほうけいに きりぬいて ちいさくする
function shrinkImage(file, size = MY_IMG_SIZE) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("よみこみに しっぱいしました"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("がぞうを ひらけませんでした"));
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FBF8F0";
        ctx.fillRect(0, 0, size, size);
        // まんなかを せいほうけいで きりぬく
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  let r = Math.random() * total;
  for (const it of GACHA_ITEMS) {
    r -= RARITY_WEIGHT[it.rarity];
    if (r <= 0) return it;
  }
  return GACHA_ITEMS[0];
}

// もっている そうび から ステータスを けいさんする
function statsFor(owned, branch) {
  const bb = (branch && BRANCH_BONUS[branch]) || {
    atk: 0,
    def: 0,
    timeMult: 1,
    critBonus: 0,
    pointMult: 1,
  };
  const has = (id) => owned.includes(id);
  const best = (slot, key) =>
    SHOP_ITEMS.filter((it) => it.slot === slot && has(it.id)).reduce(
      (max, it) => Math.max(max, it[key] || 0),
      0
    );
  return {
    atk: 3 + best("weapon", "atk") + bb.atk,
    def: best("shield", "def") + bb.def,
    streakBonus: has("boots") ? 1 : 0,
    pointMult: (has("coin") ? 1.5 : 1) * bb.pointMult,
    thresholdMult: has("crystal") ? 0.75 : 1,
    critWindow: CRIT_WINDOW + (has("feather") ? 0.08 : 0) + bb.critBonus,
    bonusHp: has("heart") ? 20 : 0,
    timeMult: bb.timeMult,
  };
}

// ステージ番号・難易度設定・直近の正答状況から出題レベル(1〜3)を決める
function computeLevel(stageNumber, difficulty, recentResults) {
  const perLevel = STAGES_PER_LEVEL[difficulty] || 3;
  let level = Math.min(3, Math.ceil(stageNumber / perLevel));

  if (recentResults.length >= 4) {
    const recent = recentResults.slice(-6);
    const acc = recent.filter(Boolean).length / recent.length;
    if (acc >= 0.85) level = Math.min(3, level + 1);
    else if (acc <= 0.4) level = Math.max(1, level - 1);
  }
  return Math.max(1, Math.min(3, level));
}

function getTimeLimit(level) {
  return level === 1 ? 9000 : level === 2 ? 7500 : 6500;
}

// ---------- 学年別の 問題づくり ----------

const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));

// 分数を かんたんにして もじれつに する
function fracText(n, d) {
  if (n === 0) return "0";
  const g = gcd(Math.abs(n), Math.abs(d));
  const sn = n / g;
  const sd = d / g;
  if (sd === 1) return String(sn);
  return `${sn}/${sd}`;
}

// 小数の まるめ(ごさ たいさく)
const dec = (v, keep = 2) => String(Number(v.toFixed(keep)));

// 学年ごとの 出題。{ text, answer(文字列), distractors(文字列の配列) } をかえす
function makeGradeProblem(grade) {
  // --- 1年: 20までの たしざん・ひきざん ---
  if (grade === 1) {
    const op = pick(["+", "-"]);
    if (op === "+") {
      const a = rnd(1, 12);
      const b = rnd(1, Math.min(9, 20 - a));
      const ans = a + b;
      return {
        text: `${a} + ${b}`,
        answer: String(ans),
        distractors: [ans + 1, ans - 1, ans + 10, a - b].map(String),
      };
    }
    const a = rnd(5, 20);
    const b = rnd(1, a - 1);
    const ans = a - b;
    return {
      text: `${a} - ${b}`,
      answer: String(ans),
      distractors: [ans + 1, ans - 1, a + b, b - 1].map(String),
    };
  }

  // --- 2年: 九九 と 2けたの たしひき ---
  if (grade === 2) {
    const kind = pick(["mul", "mul", "add", "sub"]);
    if (kind === "mul") {
      const a = rnd(1, 9);
      const b = rnd(1, 9);
      const ans = a * b;
      return {
        text: `${a} × ${b}`,
        answer: String(ans),
        distractors: [a * (b + 1), a * (b - 1), (a + 1) * b, ans + a].map(String),
      };
    }
    if (kind === "add") {
      const a = rnd(10, 89);
      const b = rnd(10, 99 - a > 10 ? 99 - a : 10);
      const ans = a + b;
      return {
        text: `${a} + ${b}`,
        answer: String(ans),
        distractors: [ans + 10, ans - 10, ans + 1, ans - 1].map(String),
      };
    }
    const a = rnd(30, 99);
    const b = rnd(10, a - 5);
    const ans = a - b;
    return {
      text: `${a} - ${b}`,
      answer: String(ans),
      distractors: [ans + 10, ans - 10, ans + 1, a + b].map(String),
    };
  }

  // --- 3年: わり算(わりきれる)・2けた×1けた・3けたの たしひき ---
  if (grade === 3) {
    const kind = pick(["div", "div", "mul", "addsub"]);
    if (kind === "div") {
      const b = rnd(2, 9);
      const ans = rnd(2, 9);
      const a = b * ans;
      return {
        text: `${a} ÷ ${b}`,
        answer: String(ans),
        distractors: [ans + 1, ans - 1, a - b, b].map(String),
      };
    }
    if (kind === "mul") {
      const a = rnd(11, 99);
      const b = rnd(2, 9);
      const ans = a * b;
      return {
        text: `${a} × ${b}`,
        answer: String(ans),
        distractors: [ans + b, ans - b, ans + 10, a * (b + 1)].map(String),
      };
    }
    let a = rnd(120, 899);
    let b = rnd(50, 300);
    const plus = Math.random() < 0.5;
    if (!plus && a < b) [a, b] = [b, a]; // ひきざんで マイナスに ならないように
    const ans = plus ? a + b : a - b;
    return {
      text: `${a} ${plus ? "+" : "-"} ${b}`,
      answer: String(ans),
      distractors: [ans + 100, ans - 100, ans + 10, ans - 1].map(String),
    };
  }

  // --- 4年: 2けた×2けた・あまりのある わり算・小数の たしひき ---
  if (grade === 4) {
    const kind = pick(["mul2", "divmod", "decimal"]);
    if (kind === "mul2") {
      const a = rnd(12, 49);
      const b = rnd(11, 29);
      const ans = a * b;
      return {
        text: `${a} × ${b}`,
        answer: String(ans),
        distractors: [ans + a, ans - a, ans + 100, ans - 10].map(String),
      };
    }
    if (kind === "divmod") {
      const b = rnd(3, 9);
      const q = rnd(3, 12);
      const r = rnd(1, b - 1);
      const a = b * q + r;
      return {
        text: `${a} ÷ ${b}`,
        answer: `${q}あまり${r}`,
        distractors: [
          `${q + 1}あまり${r}`,
          `${q}あまり${(r % (b - 1)) + 1}`,
          `${q - 1}あまり${r}`,
          `${q}あまり0`,
        ],
      };
    }
    const a = rnd(11, 99) / 10;
    const b = rnd(11, 99) / 10;
    const plus = Math.random() < 0.5;
    const ans = plus ? a + b : Math.max(a, b) - Math.min(a, b);
    const [x, y] = plus ? [a, b] : [Math.max(a, b), Math.min(a, b)];
    return {
      text: `${dec(x, 1)} ${plus ? "+" : "-"} ${dec(y, 1)}`,
      answer: dec(ans, 1),
      distractors: [
        dec(ans + 1, 1),
        dec(ans - 1, 1),
        dec(ans + 0.1, 1),
        dec(ans * 10, 1),
      ],
    };
  }

  // --- 5年: 小数の かけわり・同分母の分数 ---
  if (grade === 5) {
    const kind = pick(["decmul", "decdiv", "frac"]);
    if (kind === "decmul") {
      const a = rnd(11, 59) / 10;
      const b = rnd(2, 9);
      const ans = a * b;
      return {
        text: `${dec(a, 1)} × ${b}`,
        answer: dec(ans, 1),
        distractors: [
          dec(ans + b / 10, 1),
          dec(ans - b / 10, 1),
          dec(ans * 10, 1),
          dec(ans / 10, 2),
        ],
      };
    }
    if (kind === "decdiv") {
      const b = rnd(2, 9);
      const q = rnd(11, 49) / 10;
      const a = Number((q * b).toFixed(1));
      return {
        text: `${dec(a, 1)} ÷ ${b}`,
        answer: dec(q, 1),
        distractors: [
          dec(q + 0.1, 1),
          dec(q - 0.1, 1),
          dec(q * 10, 1),
          dec(a - b, 1),
        ],
      };
    }
    const d = pick([4, 5, 6, 8, 9, 10]);
    const plus = Math.random() < 0.5;
    let n1 = rnd(1, d - 1);
    let n2 = rnd(1, d - 1);
    if (!plus && n1 < n2) [n1, n2] = [n2, n1];
    if (plus && n1 + n2 > d) n2 = Math.max(1, d - n1);
    const rn = plus ? n1 + n2 : n1 - n2;
    return {
      text: `${n1}/${d} ${plus ? "+" : "-"} ${n2}/${d}`,
      answer: fracText(rn, d),
      distractors: [
        fracText(rn, d * 2), // ぶんぼも たしてしまう まちがい
        fracText(plus ? n1 + n2 + 1 : Math.max(0, rn - 1), d),
        fracText(plus ? Math.max(1, rn - 1) : rn + 1, d),
        `${rn}/${d + 1}`,
      ],
    };
  }

  // --- 6年: 分数の かけわり・異分母の たしひき ---
  const kind = pick(["fmul", "fdiv", "fadd"]);
  if (kind === "fmul") {
    const n1 = rnd(1, 5);
    const d1 = rnd(2, 7);
    const n2 = rnd(1, 5);
    const d2 = rnd(2, 7);
    return {
      text: `${n1}/${d1} × ${n2}/${d2}`,
      answer: fracText(n1 * n2, d1 * d2),
      distractors: [
        fracText(n1 * n2, d1 + d2),
        fracText(n1 + n2, d1 * d2),
        fracText(n1 * d2, d1 * n2),
        fracText(n1 * n2 + 1, d1 * d2),
      ],
    };
  }
  if (kind === "fdiv") {
    const n1 = rnd(1, 5);
    const d1 = rnd(2, 7);
    const n2 = rnd(1, 5);
    const d2 = rnd(2, 7);
    return {
      text: `${n1}/${d1} ÷ ${n2}/${d2}`,
      answer: fracText(n1 * d2, d1 * n2),
      distractors: [
        fracText(n1 * n2, d1 * d2), // ぎゃくすうに しない まちがい
        fracText(d1 * n2, n1 * d2),
        fracText(n1 * d2 + 1, d1 * n2),
        fracText(n1 * d2, d1 * n2 + 1),
      ],
    };
  }
  const d1 = pick([2, 3, 4, 5, 6]);
  let d2 = pick([2, 3, 4, 5, 6, 8]);
  if (d2 === d1) d2 = d1 + 1;
  const n1 = rnd(1, d1 - 1);
  const n2 = rnd(1, d2 - 1);
  const num = n1 * d2 + n2 * d1;
  const den = d1 * d2;
  return {
    text: `${n1}/${d1} + ${n2}/${d2}`,
    answer: fracText(num, den),
    distractors: [
      fracText(n1 + n2, d1 + d2), // ぶんし・ぶんぼを そのまま たす まちがい
      fracText(num + 1, den),
      fracText(n1 + n2, den),
      fracText(num, den + 1),
    ],
  };
}

function makeProblem(level, mode, selectedTables) {
  // 学年モード
  if (mode && mode.startsWith("grade-")) {
    const g = parseInt(mode.split("-")[1], 10) || 1;
    const gp = makeGradeProblem(g);
    return { text: gp.text, answer: gp.answer, distractors: gp.distractors, kind: "grade" };
  }

  // かけ算モード
  if (mode !== "addsub") {
    let a;
    if (mode === "mul-random") {
      a = Math.floor(Math.random() * 9) + 1;
    } else if (mode === "mul-pick") {
      const list = selectedTables && selectedTables.length ? selectedTables : [1];
      a = list[Math.floor(Math.random() * list.length)];
    } else {
      // "mul-1" 〜 "mul-9"
      a = parseInt(mode.split("-")[1], 10) || 1;
    }
    const b = Math.floor(Math.random() * 9) + 1;
    const ans = a * b;
    return {
      text: `${a} × ${b}`,
      answer: String(ans),
      distractors: [a * (b + 1), a * (b - 1), (a + 1) * b, ans + a].map(String),
      kind: "mul",
    };
  }

  // たしざん・ひきざんモード
  let a, b;
  const op = Math.random() < 0.5 ? "+" : "-";

  if (level === 1) {
    a = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;
  } else if (level === 2) {
    a = Math.floor(Math.random() * 17) + 3;
    b = Math.floor(Math.random() * 9) + 1;
  } else {
    a = Math.floor(Math.random() * 40) + 10;
    b = Math.floor(Math.random() * 20) + 1;
  }

  if (op === "-" && a < b) [a, b] = [b, a];
  const answer = op === "+" ? a + b : a - b;
  return {
    text: `${a} ${op} ${b}`,
    answer: String(answer),
    distractors: [answer + 1, answer - 1, answer + 10, answer - 10].map(String),
    kind: "addsub",
  };
}

function makeChoices(problem) {
  const answer = problem.answer;
  const choices = new Set([answer]);

  // まちがえやすい こたえを ゆうせんして いれる
  const cands = (problem.distractors || [])
    .filter((v) => v !== answer && v !== "" && v != null && !String(v).startsWith("-"))
    .sort(() => Math.random() - 0.5);
  for (const c of cands) {
    if (choices.size >= 4) break;
    choices.add(String(c));
  }

  // たりなければ 答えの かたちに あわせて うめる
  let guard = 0;
  if (answer.includes("/")) {
    // 分数: ぶんし・ぶんぼを ずらして つくる
    const [an, ad] = answer.split("/").map(Number);
    while (choices.size < 4 && guard < 80) {
      guard++;
      const dn = Math.floor(Math.random() * 5) - 2;
      const dd = Math.floor(Math.random() * 5) - 2;
      const n = an + dn;
      const d = ad + dd;
      if (n > 0 && d > 1) choices.add(fracText(n, d));
    }
  } else if (answer.includes("あまり")) {
    // あまり: しょうと あまりを ずらして つくる
    const m = answer.match(/^(\d+)あまり(\d+)$/);
    const q = m ? Number(m[1]) : 1;
    const r = m ? Number(m[2]) : 0;
    while (choices.size < 4 && guard < 80) {
      guard++;
      const dq = Math.floor(Math.random() * 5) - 2;
      const dr = Math.floor(Math.random() * 5) - 2;
      const nq = q + dq;
      const nr = Math.max(0, r + dr);
      if (nq > 0) choices.add(`${nq}あまり${nr}`);
    }
  } else {
    const num = Number(answer);
    const isDecimal = answer.includes(".");
    while (choices.size < 4 && guard < 80) {
      guard++;
      if (Number.isNaN(num)) break;
      const delta = isDecimal
        ? (Math.floor(Math.random() * 7) - 3) / 10
        : Math.floor(Math.random() * 7) - 3;
      const cand = Number((num + delta).toFixed(isDecimal ? 1 : 0));
      if (cand >= 0 && String(cand) !== answer) choices.add(String(cand));
    }
  }
  return Array.from(choices).sort(() => Math.random() - 0.5);
}

function isBossStage(stageNumber) {
  return stageNumber % BOSS_INTERVAL === 0;
}

function enemyForStage(stageNumber) {
  if (isBossStage(stageNumber)) {
    const bossNo = stageNumber / BOSS_INTERVAL; // 1,2,3...
    const idx = (bossNo - 1) % BOSSES.length;
    const cycle = Math.floor((bossNo - 1) / BOSSES.length);
    const base = BOSSES[idx];
    return {
      ...base,
      hp: Math.round(base.hp * (1 + cycle * 0.4)),
      atk: base.atk + Math.round(cycle * 3.5),
      isBoss: true,
    };
  }
  // ボスの ステージを のぞいて かぞえる(ぜんいん とうじょうさせるため)
  const normalNo = stageNumber - Math.floor(stageNumber / BOSS_INTERVAL);
  const idx = (normalNo - 1) % ENEMIES.length;
  const cycle = Math.floor((normalNo - 1) / ENEMIES.length);
  const base = ENEMIES[idx];
  return {
    ...base,
    hp: Math.round(base.hp * (1 + cycle * 0.35)),
    atk: base.atk + Math.round(cycle * 1.6),
    isBoss: false,
  };
}

// クリアタイムに おうじた ボーナス(はやいほど たくさん)
function timeBonusFor(elapsedMs, isBoss) {
  const sec = elapsedMs / 1000;
  const target = isBoss ? 90 : 45; // このタイムを きると まんてん
  const limit = isBoss ? 240 : 120; // これを こえると ボーナスなし
  const maxBonus = isBoss ? 30 : 12;
  if (sec <= target) return maxBonus;
  if (sec >= limit) return 0;
  const ratio = 1 - (sec - target) / (limit - target);
  return Math.max(1, Math.round(maxBonus * ratio));
}

function formatTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const sec = total % 60;
  return m > 0 ? `${m}ふん${String(sec).padStart(2, "0")}びょう` : `${sec}びょう`;
}

function buildProblemState(stageNumber, difficulty, recentResults, mode, selectedTables) {
  const level = computeLevel(stageNumber, difficulty, recentResults);
  const p = makeProblem(level, mode, selectedTables);
  return {
    problem: p,
    choices: makeChoices(p),
    timeLimit: getTimeLimit(level),
    level,
  };
}

// てきを えがく
function EnemyFace({ enemy, size }) {
  const Art = enemy && ENEMY_ART[enemy.art];
  if (Art) return <Art size={size} />;
  return <span style={{ fontSize: size }}>{enemy?.emoji}</span>;
}

// 子どもの絵があればそれを、なければ絵文字を表示するモンスター表示コンポーネント
// artStyle: 'deformed'(SVG) / 'photo'(手描きの写真)
function MonsterFace({ stage, size, style, artStyle = "deformed" }) {
  const StageArt = stage?.Art || (stage?.id && STAGE_ART[stage.id]);
  if (artStyle === "deformed" && StageArt) {
    const Art = StageArt;
    return (
      <span style={{ display: "inline-flex", ...style }}>
        <Art size={size} />
      </span>
    );
  }
  if (artStyle === "photo" && !stage?.image && StageArt) {
    const Art = StageArt;
    return (
      <span style={{ display: "inline-flex", ...style }}>
        <Art size={size} />
      </span>
    );
  }
  if (stage?.image) {
    return (
      <img
        src={stage.image}
        alt={stage.name}
        style={{
          width: size,
          height: size,
          objectFit: "cover",
          borderRadius: "50%",
          border: "2px solid #4A4580",
          background: "#F5F3FF",
          ...style,
        }}
      />
    );
  }
  return <span style={{ fontSize: size, ...style }}>{stage?.emoji}</span>;
}

  const [flashPlayer, setFlashPlayer] = useState(false);

  const saveTimer = useRef(null);
  const remainingRef = useRef(9000); // のこり時間(ms)
  const lastTickRef = useRef(Date.now());
  const tickRef = useRef(null);
  const answeredRef = useRef(false);
  const stageStartPoints = useRef(0);
  const stageStartTime = useRef(Date.now());
  const recentResultsRef = useRef([]);
  // 1もんあたりの ほうしゅうは ちいさいので、はんぱを つぎに もちこす
  const pointFracRef = useRef(0);
  const expFracRef = useRef(0);

  const statsBase = statsFor(owned, branch);
  const stats = {
    ...statsBase,
    atk: statsBase.atk + rebirth,
    pointMult: statsBase.pointMult * (1 + rebirth * 0.1),
  };
  // みちの とくちょうで かんがえる じかんが かわる
  const timeFor = (base, b = branch) => {
    const branchMult = (BRANCH_BONUS[b] && BRANCH_BONUS[b].timeMult) || 1;
    const stageMult = towerMode
      ? stageTimeFactor(towerFloor * BOSS_INTERVAL, true)
      : stageTimeFactor(stageNumber, isBossStage(stageNumber));
    return Math.round(base * branchMult * stageMult * timeMultFor(mode));
  };
  const thresholdFor = (st) => Math.ceil(st.threshold * stats.thresholdMult);

  const stagePath = stagePathFor(branch);
  const stageIndex = (() => {
    let idx = 0;
    stagePath.forEach((s, i) => {
      if (exp >= thresholdFor(s)) idx = i;
    });
    return idx;
  })();
  const isFinalForm = stageIndex === stagePath.length - 1 && stagePath.length === 5;
  const towerUnlocked = isFinalForm || bestFloor > 0 || rebirth > 0;
  const stage = stagePath[stageIndex];
  const nextStage = stagePath[stageIndex + 1];
  const maxHp = stage.maxHp + stats.bonusHp;
  const atk = stats.atk;
  const def = stats.def;
  const streakBonus = stats.streakBonus;

  // ---------- 読み込み ----------
  useEffect(() => {
    (async () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          setPoints(data.points ?? 0);
          setCorrectCount(data.correctCount ?? 0);
          // ふるいセーブの アイテムIDを あたらしいIDに あわせる
          const idMap = { sword: "sword1", shield: "shield1" };
          setOwned((data.owned ?? []).map((id) => idMap[id] || id));
          const sn = data.stageNumber ?? 1;
          const diff = data.difficulty ?? "normal";
          setStageNumber(sn);
          setDifficulty(diff);
          if (data.artStyle) setArtStyle(data.artStyle);
          if (data.mode) setMode(data.mode);
          if (data.selectedTables) setSelectedTables(data.selectedTables);
          if (data.bag) setBag(data.bag);
          if (typeof data.exp === "number") setExp(data.exp);
          else if (typeof data.correctCount === "number") setExp(data.correctCount); // ふるいセーブの ひきつぎ
          if (data.rebirth) setRebirth(data.rebirth);
          if (data.bestFloor) setBestFloor(data.bestFloor);
          if (data.records) setRecords((r) => ({ ...r, ...data.records }));
          if (data.myMonsters) setMyMonsters(data.myMonsters);
          if (data.gachaOwned) setGachaOwned(data.gachaOwned);
          if (typeof data.shards === "number") setShards(data.shards);
          if (typeof data.gachaCount === "number") setGachaCount(data.gachaCount);
          if (data.freeGachaDate) setFreeGachaDate(data.freeGachaDate);
          if (data.equipped) setEquipped((eq) => ({ ...eq, ...data.equipped }));
          if (data.savedAt) setSavedAt(data.savedAt);
          setEnemyHp(data.enemyHp ?? enemyForStage(sn).hp);
          if (data.branch) setBranch(data.branch);
          const savedPath = stagePathFor(data.branch ?? null);
          const savedExp = typeof data.exp === "number" ? data.exp : data.correctCount ?? 0;
          let stIdx = 0;
          savedPath.forEach((sv, i) => {
            if (savedExp >= sv.threshold) stIdx = i;
          });
          const st = savedPath[stIdx];
          setPlayerHp(data.playerHp ?? (st ? st.maxHp : STAGE_DEFS.egg.maxHp));
          stageStartPoints.current = data.points ?? 0;

          const built = buildProblemState(sn, diff, [], data.mode ?? "addsub", data.selectedTables ?? [2, 3, 4, 5]);
          setProblem(built.problem);
          setChoices(built.choices);
          const loadedMode = data.mode ?? "addsub";
          const loadedLim = Math.round(
            built.timeLimit *
              ((BRANCH_BONUS[data.branch] && BRANCH_BONUS[data.branch].timeMult) || 1) *
              stageTimeFactor(data.stageNumber ?? 1, isBossStage(data.stageNumber ?? 1)) *
              timeMultFor(loadedMode)
          );
          setTimeLimit(loadedLim);
          setCurrentLevel(built.level);
          remainingRef.current = loadedLim;
        }
      } catch (e) {
        // 保存データなし、または初回起動
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  // ---------- 保存(デバウンス) ----------
  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    setSaveStatus("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            points,
            correctCount,
            owned,
            stageNumber,
            enemyHp,
            playerHp,
            difficulty,
            artStyle,
            mode,
            selectedTables,
            bag,
            branch,
            exp,
            rebirth,
            bestFloor,
            records,
            myMonsters,
            gachaOwned,
            shards,
            gachaCount,
            freeGachaDate,
            equipped,
            savedAt: Date.now(),
          })
        );
        setSaveStatus("saved");
        setSaveSupported(true);
        setSavedAt(Date.now());
      } catch (e) {
        setSaveStatus("error");
        setSaveSupported(false);
      }
    }, 400);
  }, [
    loaded,
    points,
    correctCount,
    owned,
    stageNumber,
    enemyHp,
    playerHp,
    difficulty,
    artStyle,
    mode,
    selectedTables,
    bag,
    branch,
    exp,
    rebirth,
    bestFloor,
    records,
    myMonsters,
    gachaOwned,
    shards,
    gachaCount,
    freeGachaDate,
    equipped,
  ]);

  // さいしょから やりなおす
  async function resetSave() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      // 保存データがもともと無い場合は無視してよい
    }
    setPoints(0);
    setCorrectCount(0);
    setOwned([]);
    setBag({});
    setSandLeft(0);
    setHintedChoices(null);
    setStreak(0);
    setStageNumber(1);
    setEnemyHp(enemyForStage(1).hp);
    setPlayerHp(STAGE_DEFS.egg.maxHp);
    setBranch(null);
    setBranchPrompt(false);
    setExp(0);
    setRebirth(0);
    setBestFloor(0);
    setTowerMode(false);
    setTowerFloor(1);
    setTowerResult(null);
    setMyMonsters([]);
    setGachaOwned([]);
    setShards(0);
    setGachaCount(0);
    setFreeGachaDate(null);
    setEquipped({ hat: null, fx: null, color: null });
    setRecords({
      bossDefeated: 0,
      critCount: 0,
      maxStreak: 0,
      evolveCount: 0,
      tableCorrect: {},
      gradeCorrect: {},
      seenBranches: [],
      reachedFinal: false,
    });
    setStageClear(null);
    setEvolveEvent(null);
    prevStageIndex.current = 0;
    stageStartPoints.current = 0;
    stageStartTime.current = Date.now();
    recentResultsRef.current = [];
    const built = buildProblemState(1, difficulty, [], mode, selectedTables);
    setProblem(built.problem);
    setChoices(built.choices);
    setTimeLimit(timeFor(built.timeLimit));
    setCurrentLevel(built.level);
    setTimeLeftRatio(1);
    remainingRef.current = timeFor(built.timeLimit);
    answeredRef.current = false;
    setSavedAt(null);
    setConfirmReset(false);
    setScreen("start");
  }

  function newProblem() {
    const built = buildProblemState(stageNumber, difficulty, recentResultsRef.current, mode, selectedTables);
    setHintedChoices(null);
    let limit = timeFor(built.timeLimit);
    if (sandLeft > 0) {
      limit = Math.round(limit * 1.6);
      setSandLeft((n) => n - 1);
    }
    setProblem(built.problem);
    setChoices(built.choices);
    setTimeLimit(limit);
    setCurrentLevel(built.level);
    setTimeLeftRatio(1);
    remainingRef.current = limit;
    lastTickRef.current = Date.now();
    answeredRef.current = false;
  }

  // ---------- 制限時間タイマー ----------
  // バトル中で、じゃまが なにも ないときだけ 時間が すすむ
  const timerRunning =
    loaded &&
    screen === "game" &&
    tab === "battle" &&
    !stageClear &&
    !evolveEvent &&
    !branchPrompt &&
    !feedback &&
    !answeredRef.current;

  useEffect(() => {
    if (!timerRunning) {
      // とまっている あいだは のこり時間を へらさない
      if (tickRef.current) clearInterval(tickRef.current);
      tickRef.current = null;
      return;
    }
    lastTickRef.current = Date.now();
    tickRef.current = setInterval(() => {
      const now = Date.now();
      const delta = now - lastTickRef.current;
      lastTickRef.current = now;

      // タブを うらに していた あいだ などの 大きな とびは 1tickぶんに おさえる
      remainingRef.current -= Math.min(delta, 250);

      const ratio = Math.max(0, remainingRef.current / timeLimit);
      setTimeLeftRatio(ratio);

      if (remainingRef.current <= 0 && !answeredRef.current) {
        answeredRef.current = true;
        clearInterval(tickRef.current);
        tickRef.current = null;
        resolveTurn(null, "timeout");
      }
    }, 100);
    return () => {
      if (tickRef.current) clearInterval(tickRef.current);
      tickRef.current = null;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [timerRunning, problem, timeLimit]);

  // アプリを うらに したときも とめる
  useEffect(() => {
    const onVisibility = () => {
      lastTickRef.current = Date.now();
    };
    document.addEventListener("visibilitychange", onVisibility);
    return () => document.removeEventListener("visibilitychange", onVisibility);
  }, []);

  // いま たたかっている てきを かえす(タワーと つうじょうを ここで きりわけ)
  function currentEnemy() {
    return towerMode ? towerEnemy(towerFloor) : enemyForStage(stageNumber);
  }

  function applyEnemyAttack() {
    const enemy = currentEnemy();
    const dmg = Math.max(1, enemy.atk - def);
    setFlashPlayer(true);
    setPlayerHp((hp) => Math.max(0, hp - dmg));
    return dmg;
  }

  function resolveTurn(choice, forcedType) {
    if (feedback || stageClear || evolveEvent || branchPrompt) return;
    const elapsed = timeLimit - remainingRef.current;
    const isCorrect = forcedType !== "timeout" && choice === problem.answer;
    const isCritical = isCorrect && elapsed <= timeLimit * stats.critWindow;

    recentResultsRef.current = [...recentResultsRef.current, isCorrect].slice(-6);

    if (isCorrect) {
      const baseGain = 1 + Math.min(2, Math.floor(streak / 3)) + streakBonus;
      const raw = isCritical ? baseGain + 1 : baseGain;
      // はんぱを もちこして、ばいりつが きちんと きくようにする
      const exact = raw * stats.pointMult * rewardMult(mode) + pointFracRef.current;
      const gained = Math.floor(exact);
      pointFracRef.current = exact - gained;
      const dmg = isCritical ? Math.round(atk * CRIT_MULTIPLIER) : atk;

      setFeedback({ type: isCritical ? "critical" : "correct" });
      setFloatingText(isCritical ? `会心の一撃! -${dmg}` : `+${gained}`);
      setFlashEnemy(true);
      setStreak((s) => {
        const ns = s + 1;
        setRecords((r) => (ns > r.maxStreak ? { ...r, maxStreak: ns } : r));
        return ns;
      });
      setPoints((p) => p + gained);
      setCorrectCount((c) => c + 1);
      const exactExp = EXP_PER_CORRECT * rewardMult(mode) + expFracRef.current;
      const gainedExp = Math.floor(exactExp);
      expFracRef.current = exactExp - gainedExp;
      if (gainedExp > 0) setExp((e) => e + gainedExp);
      if (isCritical) setRecords((r) => ({ ...r, critCount: r.critCount + 1 }));
      // 学年べつの せいかいすう(しょうごうよう)
      if (mode && mode.startsWith("grade-")) {
        const g = parseInt(mode.split("-")[1], 10);
        if (g >= 1 && g <= 6) {
          setRecords((r) => ({
            ...r,
            gradeCorrect: { ...(r.gradeCorrect || {}), [g]: ((r.gradeCorrect || {})[g] || 0) + 1 },
          }));
        }
      }
      // 九九は だんごとに かぞえる(しょうごうよう)
      if (problem.text && problem.text.includes("×")) {
        const a = parseInt(problem.text.split("×")[0].trim(), 10);
        if (a >= 1 && a <= 9) {
          setRecords((r) => ({
            ...r,
            tableCorrect: { ...r.tableCorrect, [a]: (r.tableCorrect[a] || 0) + 1 },
          }));
        }
      }
      setEnemyHp((hp) => Math.max(0, hp - dmg));
    } else {
      const type = forcedType === "timeout" ? "timeout" : "wrong";
      const dmg = applyEnemyAttack();
      setFeedback({ type });
      setFloatingText(`-${dmg}`);
      setShake(true);
      setStreak(0);
    }

    setTimeout(() => {
      setFeedback(null);
      setFloatingText(null);
      setShake(false);
      setFlashEnemy(false);
      setFlashPlayer(false);
      newProblem();
    }, 800);
  }

  function handleAnswer(choice) {
    if (feedback || answeredRef.current || stageClear || evolveEvent || branchPrompt) return;
    answeredRef.current = true;
    if (tickRef.current) clearInterval(tickRef.current);
    resolveTurn(choice, null);
  }

  // 敵撃破チェック → ステージクリア画面へ
  useEffect(() => {
    if (enemyHp === 0 && !stageClear) {
      const t = setTimeout(() => {
        const beaten = currentEnemy();
        const elapsed = Date.now() - stageStartTime.current;
        const bonus = timeBonusFor(elapsed, beaten.isBoss);
        const bonusScaled = Math.round(bonus * rewardMult(mode));
        if (bonusScaled > 0) setPoints((pt) => pt + bonusScaled);
        const gainedExp = Math.round(
          (beaten.isBoss ? EXP_PER_BOSS : EXP_PER_STAGE) * rewardMult(mode)
        );
        setExp((e) => e + gainedExp);
        if (beaten.isBoss) {
          setRecords((r) => ({ ...r, bossDefeated: r.bossDefeated + 1 }));
        }
        setStageClear({
          defeatedName: beaten.name,
          wasBoss: beaten.isBoss,
          expGained: gainedExp,
          pointsEarned: points - stageStartPoints.current,
          clearedStage: towerMode ? towerFloor : stageNumber,
          inTower: towerMode,
          elapsed,
          timeBonus: bonusScaled,
        });
      }, 900);
      return () => clearTimeout(t);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [enemyHp, towerMode, towerFloor, stageNumber]);

  function proceedToNextStage() {
    if (towerMode) {
      const nextFloor = towerFloor + 1;
      setTowerFloor(nextFloor);
      setBestFloor((b) => Math.max(b, nextFloor - 1));
      setEnemyHp(towerEnemy(nextFloor).hp);
      // かいごとに すこしだけ かいふく
      setPlayerHp((hp) => Math.min(maxHp, hp + Math.round(maxHp * 0.3)));
      stageStartPoints.current = points;
      stageStartTime.current = Date.now();
      setStageClear(null);
      setTab("battle");
      const b2 = buildProblemState(nextFloor * BOSS_INTERVAL, difficulty, recentResultsRef.current, mode, selectedTables);
      setProblem(b2.problem);
      setChoices(b2.choices);
      setTimeLimit(timeFor(b2.timeLimit));
      setCurrentLevel(b2.level);
      setTimeLeftRatio(1);
      remainingRef.current = timeFor(b2.timeLimit);
      answeredRef.current = false;
      return;
    }
    const next = stageNumber + 1;
    setStageNumber(next);
    setEnemyHp(enemyForStage(next).hp);
    stageStartPoints.current = points;
    stageStartTime.current = Date.now();
    setStageClear(null);
    setTab("battle");
    const built = buildProblemState(next, difficulty, recentResultsRef.current, mode, selectedTables);
    setProblem(built.problem);
    setChoices(built.choices);
    setTimeLimit(timeFor(built.timeLimit));
    setCurrentLevel(built.level);
    setTimeLeftRatio(1);
    remainingRef.current = timeFor(built.timeLimit);
    lastTickRef.current = Date.now();
    answeredRef.current = false;
  }

  // プレイヤーひんしチェック(HP0で回復してつづける、やさしめの罰則)
  useEffect(() => {
    if (playerHp === 0 && loaded) {
      const t = setTimeout(() => {
        if (bag.seed > 0) {
          setBag((b) => ({ ...b, seed: b.seed - 1 }));
          setItemToast("🌱 ふっかつのタネで たちあがった!");
          setPlayerHp(maxHp);
          return;
        }
        if (towerMode) {
          // タワーは ここで しゅうりょう
          const reached = towerFloor;
          setBestFloor((b) => Math.max(b, reached));
          setTowerResult({ floor: reached, best: Math.max(bestFloor, reached) });
          setTowerMode(false);
          setPlayerHp(maxHp);
          return;
        }
        setPoints((p) => Math.max(0, p - 3));
        setPlayerHp(maxHp);
      }, 900);
      return () => clearTimeout(t);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [playerHp]);

  // 進化したら演出を出して全回復
  const prevStageIndex = useRef(stageIndex);
  useEffect(() => {
    if (stageIndex !== prevStageIndex.current) {
      const from = stagePath[prevStageIndex.current] || stagePath[0];
      const to = stagePath[stageIndex];
      prevStageIndex.current = stageIndex;
      setPlayerHp(to.maxHp + stats.bonusHp);
      if (stageIndex > 0) {
        setEvolveEvent({ from, to, phase: "shake" });
        setRecords((r) => ({
          ...r,
          evolveCount: r.evolveCount + 1,
          reachedFinal: r.reachedFinal || stageIndex === stagePath.length - 1,
        }));
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [stageIndex]);

  // アイテムの おしらせを じどうで けす
  useEffect(() => {
    if (!itemToast) return;
    const t = setTimeout(() => setItemToast(null), 1800);
    return () => clearTimeout(t);
  }, [itemToast]);

  // ノコスコから さきは えだを えらぶ
  useEffect(() => {
    if (!loaded || screen !== "game") return;
    if (branch) return;
    const nokosukoNext = Math.ceil(STAGE_DEFS.surikara.threshold * stats.thresholdMult);
    if (exp >= nokosukoNext && !branchPrompt && !evolveEvent) {
      setBranchPrompt(true);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [correctCount, branch, loaded, screen]);

  function chooseBranch(id) {
    setBranch(id);
    setBranchPrompt(false);
    setRecords((r) => ({
      ...r,
      seenBranches: r.seenBranches.includes(id) ? r.seenBranches : [...r.seenBranches, id],
    }));
  }

  // 進化演出のフェーズ進行(ぶるぶる → まぶしい光 → お披露目)
  useEffect(() => {
    if (evolveEvent?.phase === "shake") {
      const t = setTimeout(() => {
        setEvolveEvent((e) => (e ? { ...e, phase: "reveal" } : null));
      }, 1800);
      return () => clearTimeout(t);
    }
  }, [evolveEvent?.phase]);

  // そうびを かう(じょうい tier は したいを もっていないと かえない)
  function canBuy(item) {
    if (owned.includes(item.id)) return false;
    if (item.needs && !owned.includes(item.needs)) return false;
    return points >= item.cost;
  }

  function buyItem(item) {
    if (!canBuy(item)) return;
    setPoints((p) => p - item.cost);
    setOwned((o) => [...o, item.id]);
    setItemToast(`${item.emoji} ${item.name} を そうびした!`);
  }

  // どうぐを かう
  function buyConsumable(item) {
    if (points < item.cost) return;
    setPoints((p) => p - item.cost);
    setBag((b) => ({ ...b, [item.id]: (b[item.id] || 0) + 1 }));
    setItemToast(`${item.emoji} ${item.name} を てにいれた!`);
  }

  // どうぐを つかう
  function useConsumable(id) {
    if (!(bag[id] > 0)) return;
    if (id === "potion") {
      if (playerHp >= maxHp) {
        setItemToast("HPは まんたんだよ");
        return;
      }
      setPlayerHp(maxHp);
      setItemToast("🧪 HPが ぜんかいふく!");
    } else if (id === "sand") {
      setSandLeft(3);
      setItemToast("⏳ つぎの3もん じかんが のびる!");
    } else if (id === "glasses") {
      if (hintedChoices || feedback) return;
      const wrong = choices.filter((c) => c !== problem.answer);
      const toHide = wrong.sort(() => Math.random() - 0.5).slice(0, 2);
      setHintedChoices(toHide);
      setItemToast("👓 まちがいを 2つ けした!");
    } else if (id === "seed") {
      setItemToast("🌱 おまもりは たおれたとき じどうで はつどうするよ");
      return; // タネは じどうはつどう なので ここでは へらさない
    }
    setBag((b) => ({ ...b, [id]: b[id] - 1 }));
  }

  const enemy = currentEnemy();
  const enemyMaxHp = enemy.hp;

  if (!loaded) {
    return (
      <div style={styles.loadingScreen}>
        <div style={{ fontSize: 40 }}>🥚</div>
        <div style={{ color: "#F5F3FF", fontFamily: "'Baloo 2', sans-serif", marginTop: 12 }}>
          よみこみちゅう...
        </div>
      </div>
    );
  }

  // どの タブから はいっても もんだいと タイマーを しょきかする
  function enterGame(startTab = "battle") {
    stageStartTime.current = Date.now();
    lastTickRef.current = Date.now();
    answeredRef.current = false;
    recentResultsRef.current = [];
    pointFracRef.current = 0;
    expFracRef.current = 0;
    const built = buildProblemState(stageNumber, difficulty, [], mode, selectedTables);
    setProblem(built.problem);
    setChoices(built.choices);
    setTimeLimit(timeFor(built.timeLimit));
    setCurrentLevel(built.level);
    setTimeLeftRatio(1);
    remainingRef.current = timeFor(built.timeLimit);
    setHintedChoices(null);
    setFeedback(null);
    setTab(startTab);
    setScreen("game");
  }

  function handleStart() {
    enterGame("battle");
  }

  const hasProgress = correctCount > 0 || points > 0;

  // ---------- じさく モンスター ----------
  const freeGachaAvailable = freeGachaDate !== todayKey();

  async function handlePickImage(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (myMonsters.length >= MY_MONSTER_MAX) {
      setItemToast(`とうろくは ${MY_MONSTER_MAX}たいまで`);
      return;
    }
    setImgBusy(true);
    try {
      const data = await shrinkImage(file);
      setDraftImage(data);

  // ---------- ガチャ ----------
  function applyGachaResults(items) {
    const news = [];
    let addShards = 0;
    const owned = [...gachaOwned];
    items.forEach((it) => {
      if (owned.includes(it.id)) {
        addShards += it.rarity * 2;
        news.push({ item: it, isNew: false });
      } else {
        owned.push(it.id);
        news.push({ item: it, isNew: true });
      }
    });
    setGachaOwned(owned);
    if (addShards > 0) setShards((v) => v + addShards);
    setGachaCount((c) => c + items.length);
    setGachaResult(news);
  }

  function drawGacha(times, free) {
    const cost = free ? 0 : times === 10 ? GACHA_COST_10 : GACHA_COST * times;
    if (!free && points < cost) {
      setItemToast("ポイントが たりないよ");
      return;
    }
    if (!free) setPoints((p) => p - cost);
    if (free) setFreeGachaDate(todayKey());
    const items = Array.from({ length: times }, () => rollGacha());
    applyGachaResults(items);
  }

  function exchangeShards(item) {
    if (shards < SHARD_EXCHANGE || gachaOwned.includes(item.id)) return;
    setShards((v) => v - SHARD_EXCHANGE);
    setGachaOwned((o) => [...o, item.id]);
    setItemToast(`${item.emoji} ${item.name} と こうかんした!`);
  }

  function toggleEquip(item) {
    if (!gachaOwned.includes(item.id)) return;
    setEquipped((eq) => ({

          <div style={styles.shopGroupLabel}>
            🎽 もっている アイテム({gachaOwned.length}/{GACHA_ITEMS.length})
          </div>
          <div style={styles.gachaGrid}>
            {GACHA_ITEMS.map((it) => {
              const has = gachaOwned.includes(it.id);
              const on = equipped[it.kind] === it.id;
              return (
                <button
                  key={it.id}
                  onClick={() => (has ? toggleEquip(it) : exchangeShards(it))}
                  disabled={!has && shards < SHARD_EXCHANGE}
                  style={{
                    ...styles.gachaCard,
                    opacity: has ? 1 : 0.45,
                    borderColor: on ? "#7ED957" : RARITY_COLOR[it.rarity],
                  }}
                >
                  <div style={{ fontSize: 24 }}>{has ? it.emoji : "❔"}</div>
                  <div style={styles.gachaName}>{has ? it.name : "？？？"}</div>
                  <div style={{ ...styles.gachaRarity, color: RARITY_COLOR[it.rarity] }}>
                    {RARITY_LABEL[it.rarity]}
                  </div>
                  {has ? (
                    on && <div style={styles.equipTag}>そうびちゅう</div>
                  ) : (
                    <div style={styles.gachaExchange}>💎{SHARD_EXCHANGE}で こうかん</div>
                  )}
                </button>
              );
            })}
          </div>
          <div style={styles.gachaNote}>
            おなじ ものが でたら かけらに かわるよ。かけら {SHARD_EXCHANGE}こで すきな ものと こうかんできる
          </div>
        </div>
      )}

      {/* ガチャの けっか */}
      {gachaResult && (
        <div style={styles.evoOverlay}>
          <div style={styles.evoCaption}>ガチャの けっか</div>
          <div style={styles.gachaResultGrid}>
            {gachaResult.map((r, i) => (
              <div
                key={i}
                className="pop"
                style={{
                  ...styles.gachaResultCard,
                  borderColor: RARITY_COLOR[r.item.rarity],
                }}
              >
                <div style={{ fontSize: 26 }}>{r.item.emoji}</div>
                <div style={styles.gachaName}>{r.item.name}</div>
                <div style={{ ...styles.gachaRarity, color: RARITY_COLOR[r.item.rarity] }}>
                  {RARITY_LABEL[r.item.rarity]}
                </div>
                <div style={styles.newOrShard}>{r.isNew ? "NEW!" : `💎+${r.item.rarity * 2}`}</div>
              </div>
            ))}
          </div>
          <button onClick={() => setGachaResult(null)} style={styles.evoBtn}>
            とじる
          </button>
        </div>
      )}

      {/* タブナビ */}
      <div style={styles.tabBar}>
        {[
          { id: "battle", label: "バトル", emoji: "⚔️" },
          { id: "dex", label: "ずかん", emoji: "📖" },
          { id: "shop", label: "ショップ", emoji: "🛒" },
          { id: "gacha", label: "ガチャ", emoji: "🎁" },
        ].map((t) => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            style={{
              ...styles.tabBtn,
              ...(tab === t.id ? styles.tabBtnActive : {}),
            }}
          >
            <div style={{ fontSize: 20 }}>{t.emoji}</div>
            <div style={{ fontSize: 12 }}>{t.label}</div>
          </button>
        ))}
      </div>
    </div>
  );
}
