<style>
  html, body, #root { margin:0; padding:0; min-height:100%; background:#1B1B3A; }

  #root { background:#1B1B3A; }
  * { -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none; touch-action:manipulation; }

<body>
<div id="root">
  <div id="boot">
    <div class="t">よみこみちゅう...</div>
    <div class="s" id="bootstep">じゅんび しています</div>
  </div>
</div>

<script>
// ---- じどう こうしん ----
// じぶんの ばんごう
var APP_VERSION = "20261027-075817";

// サーバーに「いまの さいしんは なにか」を きく。
// ふるい ないようが のこっていても、この といあわせは かならず
// ネットワークまで とどくので、ちゃんと きづける。
(function checkUpdate() {
  try {
    // すでに よみなおした あとなら なにもしない
    if (location.search.indexOf("v=") !== -1) return;

    var url = location.pathname + "?_=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(function (r) {
        return r.ok ? r.text() : null;
      })
      .then(function (text) {
        if (!text) return;
        var m = text.match(/APP_VERSION = "([^"]+)"/);
        if (!m) return;
        var latest = m[1];
        if (latest !== APP_VERSION) {
          // あたらしいものが あるので よみなおす
          location.replace(location.pathname + "?v=" + latest);
        }
      })
      .catch(function () {
        // つながらなくても そのまま あそべる
      });
  } catch (e) {
    // なにか あっても アプリは うごかす
  }
})();

// CDNから ライブラリを よみこむ。ダメなら べつの CDNを ためす。
var CDNS = [
  "https://unpkg.com/",
  "https://cdn.jsdelivr.net/npm/"
];
var LIBS = [
  ["react@18/umd/react.production.min.js", function(){ return window.React; }],
  ["react-dom@18/umd/react-dom.production.min.js", function(){ return window.ReactDOM; }]
];

function step(msg){
  var el = document.getElementById("bootstep");
  if (el) el.textContent = msg;
}

function fail(title, detail){
  var root = document.getElementById("root");
  root.innerHTML =
    '<div id="boot"><div class="t">' + title + '</div>' +
    '<div class="err">' + detail + '</div></div>';
}

function loadLib(i, cdnIndex, done){
  if (i >= LIBS.length) { done(); return; }
  var path = LIBS[i][0], check = LIBS[i][1];
  if (check()) { loadLib(i + 1, 0, done); return; }
  if (cdnIndex >= CDNS.length) {
    fail("ライブラリを よみこめませんでした",
      "インターネットに つながっているか かくにんしてください。<br><br>" +
      "また、ファイルアプリの プレビューでは そとから よみこむ しくみが とまるため、" +
      "この画面から さきに すすみません。<br><br>" +
      "GitHub Pages などに アップロードして、その URL を Safari や Chrome で ひらいてください。");
    return;
  }
  step("よみこみちゅう (" + (i + 1) + "/" + LIBS.length + ")");
  var sc = document.createElement("script");
  sc.src = CDNS[cdnIndex] + path;
  sc.crossOrigin = "anonymous";
  sc.onload = function(){ loadLib(i + 1, 0, done); };
  sc.onerror = function(){ loadLib(i, cdnIndex + 1, done); };
  document.head.appendChild(sc);
}

window.addEventListener("error", function(e){
  var msg = String((e && e.message) || e);
  if (!window.__started) { fail("エラーが おきました", msg); return; }
  // きどう ご: がめんが からっぽに なっていたら ないようを だす

}

function computeLevel(stageNumber, difficulty, recentResults) {
  const perLevel = STAGES_PER_LEVEL[difficulty] || 3;
  let level = Math.min(3, Math.ceil(stageNumber / perLevel));
  if (recentResults.length >= 4) {
    const recent = recentResults.slice(-6);
    const acc = recent.filter(Boolean).length / recent.length;
    if (acc >= 0.85) level = Math.min(3, level + 1);
    else if (acc <= 0.4) level = Math.max(1, level - 1);
  }
  return Math.max(1, Math.min(3, level));
}
